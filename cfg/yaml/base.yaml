mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-interval: 15
keep-alive-idle: 30

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.googlevideo.com"

tun:
  enable: true
  stack: mixed
  mtu: 1492
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true

proxies:
  - name: "VLESS-Reality-XHTTP-Speed"
    type: vless
    server: 123.12.15.123
    port: 443
    udp: true
    uuid: 103dcbce-2234-4902-9ecf-880e6da1ce56
    packet-encoding: xudp
    encryption: none
    network: xhttp
    tls: true
    alpn:
      - h2
    servername: www.microsoft.com
    client-fingerprint: chrome
    skip-cert-verify: false
    reality-opts:
      public-key: sthbVvv4NTa0i8-bsMXEyTr7E-FZTdq-NQWzwhbTiXw
      short-id: 064d
    xhttp-opts:
      path: "/"
      host: www.microsoft.com
      mode: auto
      reuse-settings:
        max-concurrency: "16-32"
        c-max-reuse-times: "0"
        h-max-reusable-secs: "1800-3000"

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - VLESS-Reality-XHTTP-Speed
      - DIRECT

