[custom]
; ==========================================================
; 规则生成器
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 规则
; ==========================================================

; --- 1. 最高优先级：本地私网与局域网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- 2. 特定服务国内直连 ---
ruleset=DIRECT,[]GEOSITE,apple-cn
ruleset=DIRECT,[]GEOSITE,microsoft@cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download

; --- 3. VoGter直连补丁 ---
ruleset=DIRECT,clash-classic:https://cdn.jsdelivr.net/gh/VoGter0616/VoGter_Clash@main/rule/Merged/Direct_Merged.list
ruleset=DIRECT,clash-classic:https://cdn.jsdelivr.net/gh/VoGter0616/VoGter_Clash@main/rule/Merged/CDN_Merged.list

; --- 4. 核心代理防线：AI 专项 ---
ruleset=🧠 ChatGPT,[]GEOSITE,openai
ruleset=🧠 ChatGPT,clash-classic:https://cdn.jsdelivr.net/gh/VoGter0616/VoGter_Clash@main/rule/Clash/OpenAI.list
ruleset=🧠 Gemini,clash-classic:https://cdn.jsdelivr.net/gh/VoGter0616/VoGter_Clash@main/rule/Clash/Gemini.list
ruleset=🧠 AI,clash-classic:https://cdn.jsdelivr.net/gh/VoGter0616/VoGter_Clash@main/rule/Merged/AI_Merged.list

; ==========================================================
; 精细化应用分流区域
; ==========================================================

; --- 社交 & 通讯 ---
ruleset=📱 社交,clash-classic:https://cdn.jsdelivr.net/gh/VoGter0616/VoGter_Clash@main/rule/Merged/Social_Merged.list
ruleset=📱 社交,[]GEOSITE,category-communication
ruleset=📱 社交,[]GEOSITE,category-social-media-!cn
ruleset=📱 社交,[]GEOIP,telegram,no-resolve
ruleset=📱 社交,[]GEOIP,facebook,no-resolve
ruleset=📱 社交,[]GEOIP,twitter,no-resolve

; --- 影音流媒体 ---
ruleset=🎞️ YouTube,[]GEOSITE,youtube
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve
ruleset=🎵 Spotify,[]GEOSITE,spotify
ruleset=🎶 TikTok,[]GEOSITE,tiktok
ruleset=🎶 TikTok,[]GEOIP,tiktok,no-resolve
ruleset=🎬 Disney+,[]GEOSITE,disney
ruleset=🎥 HBO,[]GEOSITE,hbo
ruleset=📺 Bahamut,clash-classic:https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Bahamut/Bahamut.list

; --- 谷歌专项 ---
ruleset=🇬 Google,[]GEOSITE,googlefcm
ruleset=🇬 Google,[]GEOSITE,google
ruleset=🇬 Google,[]GEOIP,google,no-resolve

; --- 开发 & 常用工具 ---
ruleset=📘 GitHub,[]GEOSITE,github
ruleset=📘 GitHub,[]GEOIP,github,no-resolve
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=Ⓜ️ OneDrive,[]GEOSITE,onedrive
ruleset=Ⓜ️ Microsoft,[]GEOSITE,microsoft
ruleset=Ⓜ️ Microsoft,[]GEOIP,microsoft,no-resolve
ruleset=🍎 Apple,[]GEOSITE,apple

; --- 游戏联机 ---
ruleset=🕹️ 游戏,clash-classic:https://cdn.jsdelivr.net/gh/VoGter0616/VoGter_Clash@main/rule/Merged/Game_Merged.list
ruleset=🕹️ 游戏,[]GEOSITE,category-games

; --- 功能组 ---
ruleset=🏠 我的群晖,clash-classic:https://cdn.jsdelivr.net/gh/VoGter0616/VoGter_Clash@main/rule/Clash/Synology_Proxy.list

; ==========================================================
; 兜底拦截网
; ==========================================================

; --- 国外通用域名大包兜底及VoGter代理补丁 ---
ruleset=🌍 国外,[]GEOSITE,geolocation-!cn
ruleset=🌍 国外,clash-classic:https://cdn.jsdelivr.net/gh/VoGter0616/VoGter_Clash@main/rule/Merged/Proxy_Merged.list

; --- GFW 兜底 ---
ruleset=🧭 手动选择,[]GEOSITE,gfw

; --- 国内直连兜底 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 非标端口 ---
;PT/BT 优化开启会使 80/443 以外端口的流量直连
ruleset=🔀 非标端口,clash-classic:https://cdn.jsdelivr.net/gh/VoGter0616/VoGter_Clash@main/rule/Clash/Custom_Port_Direct.list

; --- 漏网之鱼 ---
;国内冷门域名会命中漏网之鱼，如影响使用，请设置漏网之鱼直连
;漏网之鱼直连时，无法通过 DNS 泄露测试，但是并不存在泄露
ruleset=🐟 漏网之鱼,[]FINAL
; ==========================================================
; 策略节点组配置
; ==========================================================

; --- 1. 出口组 ---
custom_proxy_group=🌍 国外`select`[]♻️ 自动选择`[]🧭 手动选择
custom_proxy_group=🐟 漏网之鱼`select`[]🌍 国外`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🔀 非标端口`select`[]🐟 漏网之鱼`[]DIRECT

; --- 2. 核心业务与 AI 组 ---
custom_proxy_group=🧠 AI`select`[]美国-手动`[]新加坡-手动`[]日本-手动`[]台湾-手动`[]香港-手动`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🧠 ChatGPT`select`[]美国-手动`[]新加坡-手动`[]日本-手动`[]台湾-手动`[]香港-手动`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🧠 Gemini`select`[]香港-手动`[]美国-手动`[]新加坡-手动`[]日本-手动`[]台湾-手动`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🇬 Google`select`[]香港-手动`[]美国-手动`[]新加坡-手动`[]日本-手动`[]台湾-手动`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🏠 我的群晖`select`[]DIRECT`[]香港-自动`[]台湾-自动`[]🧭 手动选择

; --- 3. 影音流媒体组 ---
custom_proxy_group=🎞️ YouTube`select`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]美国-自动`[]日本-自动`[]🧭 手动选择`[]🧭 冷门节点`[]DIRECT
custom_proxy_group=🎵 Spotify`select`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]美国-自动`[]日本-自动`[]🧭 手动选择`[]🧭 冷门节点`[]DIRECT
custom_proxy_group=🎥 Netflix`select`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]美国-自动`[]日本-自动`[]🧭 手动选择`[]🧭 冷门节点`[]DIRECT
custom_proxy_group=🎬 Disney+`select`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]美国-自动`[]日本-自动`[]🧭 手动选择`[]🧭 冷门节点`[]DIRECT
custom_proxy_group=🎥 HBO`select`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]美国-自动`[]日本-自动`[]🧭 手动选择`[]🧭 冷门节点`[]DIRECT
custom_proxy_group=📺 Bahamut`select`[]台湾-自动`[]香港-自动`[]🧭 手动选择`[]DIRECT

; --- 4. 短视频 & 社交 ---
custom_proxy_group=🎶 TikTok`select`[]新加坡-自动`[]日本-自动`[]台湾-自动`[]美国-自动`[]🧭 手动选择`[]🧭 冷门节点`[]DIRECT
custom_proxy_group=📱 社交`select`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]🧭 手动选择`[]DIRECT

; --- 5. 开发者工具、游戏与测速 ---
custom_proxy_group=🕹️ 游戏`select`[]香港-手动`[]日本-手动`[]台湾-手动`[]新加坡-手动`[]韩国-手动`[]美国-手动`[]🧭 手动选择`[]DIRECT
custom_proxy_group=📘 GitHub`select`[]新加坡-自动`[]香港-自动`[]美国-自动`[]日本-自动`[]🧭 手动选择`[]DIRECT
custom_proxy_group=Ⓜ️ OneDrive`select`[]DIRECT`[]香港-自动`[]美国-自动`[]新加坡-自动`[]🧭 手动选择
custom_proxy_group=Ⓜ️ Microsoft`select`[]DIRECT`[]香港-自动`[]美国-自动`[]新加坡-自动`[]🧭 手动选择
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]香港-自动`[]美国-自动`[]新加坡-自动`[]🧭 手动选择
custom_proxy_group=🚝 测速工具`select`[]DIRECT`[]香港-手动`[]台湾-手动`[]日本-手动`[]韩国-手动`[]新加坡-手动`[]美国-手动`[]🧭 冷门节点`[]🧭 手动选择

; --- 6. 手动选择通用组 ---
custom_proxy_group=🧭 手动选择`select`.*
custom_proxy_group=🧭 冷门节点`select`(波|柬|尼|也|克|比|尔|立|冰|秘|耳|利|埃|希|孟|芬|愛|澳|英|德|南|意|法|拿|墨|印|越|俄|瑞|智|荷|巴|沙|班|泰|非|烏|以|Australia|Konghwaguk)

; --- 7. 地区手动选择组 ---
custom_proxy_group=香港-手动`select`(广港|香港|HK|Hong Kong|🇭🇰|HongKong)
custom_proxy_group=新加坡-手动`select`(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)
custom_proxy_group=台湾-手动`select`(广台|台湾|台灣|TW|Tai Wan|TaiWan|Taiwan)
custom_proxy_group=韩国-手动`select`(广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea)
custom_proxy_group=日本-手动`select`(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)
custom_proxy_group=美国-手动`select`(广美|美|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|硅谷|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)

; --- 8. 自动测速策略组 ---
